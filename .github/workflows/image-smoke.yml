name: Image smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgres://postgres:postgres@host.docker.internal:55432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3

      - name: Build open-mcc-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          target: runtime
          load: true
          tags: smoke/open-mcc-server:local
          cache-from: |
            type=gha,scope=open-mcc-server
            type=gha,scope=open-mcc-server-smoke
          cache-to: type=gha,scope=open-mcc-server-smoke,mode=max

      - name: Build open-mcc-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          target: migrate
          load: true
          tags: smoke/open-mcc-migrate:local
          cache-from: |
            type=gha,scope=open-mcc-migrate
            type=gha,scope=open-mcc-server
            type=gha,scope=open-mcc-migrate-smoke
          cache-to: type=gha,scope=open-mcc-migrate-smoke,mode=max

      - name: Build open-mcc-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          target: runtime
          load: true
          tags: smoke/open-mcc-worker:local
          cache-from: |
            type=gha,scope=open-mcc-worker
            type=gha,scope=open-mcc-worker-smoke
          cache-to: type=gha,scope=open-mcc-worker-smoke,mode=max

      - name: Build open-mcc-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          target: runtime
          load: true
          tags: smoke/open-mcc-web:local
          cache-from: |
            type=gha,scope=open-mcc-web
            type=gha,scope=open-mcc-web-smoke
          cache-to: type=gha,scope=open-mcc-web-smoke,mode=max

      - name: Boot every image that is published
        run: node scripts/smoke-images.mjs
