# A configuration document captured from a running Minecraft Console Client instance,
# kept as a fixture so the config parser and the drift comparison are exercised against
# the real key surface rather than a hand-written approximation.
#
# The client's own explanatory comments have been removed: they are that project's
# prose, and this repository is MIT-licensed while the client is CDDL-1.0. What remains
# is the section and key structure and representative values — some configured, some
# pinned by this project rather than the client's own defaults.

