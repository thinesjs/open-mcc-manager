services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: open_mcc_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_mcc_manager"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    depends_on:
      postgres:
        condition: service_healthy

  server:
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
