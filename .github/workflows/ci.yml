name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check commit subjects
        if: github.event_name == 'pull_request'
        run: node scripts/check-commit-subjects.mjs ${{ github.event.pull_request.base.sha }}..HEAD
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @open-mcc/db db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test
      - run: pnpm build
      - name: Validate the production compose file on its own
        run: docker compose -f docker/compose.yml config --quiet
        env:
          DATABASE_URL: postgres://user:pass@db:5432/open_mcc_manager
          BETTER_AUTH_URL: https://example.invalid
          ALLOWED_ORIGINS: https://example.invalid
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret
          SEALBOX_KEYS: ci-only-not-a-real-key
      - name: Validate the development overlay
        run: docker compose -f docker/compose.yml -f docker/compose.dev.yml config --quiet
        env:
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgres://user:pass@db:5432/open_mcc_manager
          BETTER_AUTH_URL: https://example.invalid
          ALLOWED_ORIGINS: https://example.invalid
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret
          SEALBOX_KEYS: ci-only-not-a-real-key

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:sandbox
