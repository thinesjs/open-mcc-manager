name: ${COMPOSE_PROJECT_NAME:-open-mcc}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: open_mcc_manager
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
      target: build
    command: ["pnpm", "--filter", "@open-mcc/db", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/open_mcc_manager
    restart: "no"

  server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/open_mcc_manager
      PORT: "3000"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SEALBOX_KEYS: ${SEALBOX_KEYS}
      NOTIFICATION_ALLOW_HTTP: ${NOTIFICATION_ALLOW_HTTP:-false}
      NOTIFICATION_ALLOWED_HOSTS: ${NOTIFICATION_ALLOWED_HOSTS:-}
      NOTIFICATION_ALLOWED_ADDRESSES: ${NOTIFICATION_ALLOWED_ADDRESSES:-}
      NOTIFICATION_TEAMS_HOSTS: ${NOTIFICATION_TEAMS_HOSTS:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ..
      dockerfile: docker/worker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/open_mcc_manager
      SEALBOX_KEYS: ${SEALBOX_KEYS}
      NOTIFICATION_ALLOW_HTTP: ${NOTIFICATION_ALLOW_HTTP:-false}
      NOTIFICATION_ALLOWED_HOSTS: ${NOTIFICATION_ALLOWED_HOSTS:-}
      NOTIFICATION_ALLOWED_ADDRESSES: ${NOTIFICATION_ALLOWED_ADDRESSES:-}
      NOTIFICATION_TEAMS_HOSTS: ${NOTIFICATION_TEAMS_HOSTS:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
