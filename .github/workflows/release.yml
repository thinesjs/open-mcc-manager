name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: open-mcc-server
            dockerfile: docker/server/Dockerfile
            target: runtime
            cache_from: type=gha,scope=open-mcc-server
          - image: open-mcc-worker
            dockerfile: docker/worker/Dockerfile
            target: runtime
            cache_from: type=gha,scope=open-mcc-worker
          - image: open-mcc-web
            dockerfile: docker/web/Dockerfile
            target: runtime
            cache_from: type=gha,scope=open-mcc-web
          - image: open-mcc-migrate
            dockerfile: docker/server/Dockerfile
            target: migrate
            cache_from: |
              type=gha,scope=open-mcc-migrate
              type=gha,scope=open-mcc-server
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GIT_SHA=${{ github.sha }}
          cache-from: ${{ matrix.cache_from }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
